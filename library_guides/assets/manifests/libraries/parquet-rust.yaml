# Reuse proof: a second Rust crate added by manifest alone.
schema_version: library-guides.library_manifest.v1
library_id: parquet-rust
ecosystem: rust
packages:
  - name: parquet
    public_root: parquet
surface_packages: ['parquet', 'arrow', 'arrow_*', 'object_store']
profiles:
  - profile_id: parquet-rust-docsrs
    version_source: cargo_workspace_dependency
    version_key: parquet
    scope: docs.rs default documentation build; not every consumer feature set
    api_source:
      kind: docs_rs_rustdoc_json
      crate: parquet
registry_probes: []
