[package]
name = "library-guides-python-semantics"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
library-guides-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
pyrefly = { path = "upstream/pyrefly" }
pyrefly_config = { path = "upstream/crates/pyrefly_config" }
pyrefly_python = { path = "upstream/crates/pyrefly_python" }
pyrefly_util = { path = "upstream/crates/pyrefly_util" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
