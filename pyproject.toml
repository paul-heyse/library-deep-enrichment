[project]
name = "library-deep-enrichment"
version = "0.3.0"
description = "Library knowledge compiler: exact-release code facts compiled into an agent-queryable corpus"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.14,<3.15"
authors = [{ name = "Paul Heyse" }]
keywords = ["rustdoc", "cargo-metadata", "griffe", "lancedb", "library-evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Documentation",
]

# Every dependency is an exact pin taken from the committed lockfile. Bump deliberately with
# `uv lock --upgrade-package <name>` and record what changed; never widen to a range.
dependencies = [
  "attrs==26.1.0",
  "cattrs==26.2.0",
  "docutils==0.23",
  "fcapy==0.1.4.5",
  "filelock==3.32.3",
  "griffelib==2.3.0",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "igraph==1.0.0",
  "jsonschema==4.26.0",
  "lancedb==0.38.0",
  "leidenalg==0.12.0",
  "markdown-it-py==4.2.0",
  "networkx==3.6.1",
  "numpy==2.5.2",
  "pyarrow==25.0.1",
  "pylance==11.0.0",
  "pyyaml==6.0.3",
  "regex==2026.9.10",
  "rich==15.0.0",
  # FCApy requires scikit-mine 1.0.0, whose upstream metadata is broken on Python >= 3.7.
  # vendor/README.md documents the metadata-only patch; the wheel bytes are otherwise upstream.
  "scikit-mine==1.0.0+lde.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "sphobjinv==2.4",
  "typer==0.27.2",
  "z3-solver==5.1.0.0",
]

[project.optional-dependencies]
# Tokenizer and model-snapshot acquisition for the managed embedding runtime. The runtime
# itself is a pinned vLLM container; nothing here executes a model in-process, so torch is
# deliberately absent (verified 2026-09-13: no module imports it).
embed = [
  "huggingface-hub==1.31.0",
  "transformers==5.17.0",
]
pilot = [
  "datafusion==54.0.0",
  "pydantic==2.13.4",
]

[project.scripts]
library-deep-enrichment = "library_deep_enrichment.cli:app"

[project.urls]
Repository = "https://github.com/paul-heyse/library-deep-enrichment"
Issues = "https://github.com/paul-heyse/library-deep-enrichment/issues"

[dependency-groups]
dev = [
  "build==1.6.1",
  "hypothesis==6.168.0",
  # pyrefly is this project's Python semantic engine (AGENTS.md). Pinned here so the analysed
  # version is reproducible; never a global `uv tool install`.
  "pyrefly==1.3.0",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "ruff==0.16.7",
  "scipy-stubs==1.18.1.0",
  "types-docutils==0.23.0.20260911",
  "types-jsonschema==4.26.0.20260518",
  "types-networkx==3.6.1.20260911",
  "types-pyyaml==6.0.12.20260906",
  "types-regex==2026.9.10.20260911",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "library_deep_enrichment"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
scikit-mine = { path = "vendor/scikit_mine-1.0.0+lde.1-py3-none-any.whl" }

# ---------------------------------------------------------------------------- ruff
# This lint gate is the one the code was written against; changing it silently changes results.
# No per-file ignores and no growth of the ignore list: fix the cause or record an ADR.
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "pilot"]
extend-exclude = ["docs", "crates/*/upstream"]

[tool.ruff.lint]
preview = true
select = [
  "F", "E4", "E7", "E9", "I", "N", "UP", "SIM", "C4", "B", "RUF", "ANN", "D", "RET", "RSE",
  "TRY", "EM", "G", "LOG", "ISC", "TID", "ICN", "TD", "ERA", "PGH", "C90", "PLR", "W", "A",
  "ARG", "BLE", "DTZ", "PTH", "PIE", "PT", "T20", "PLW", "PLC", "PERF", "YTT", "PYI", "TC",
  "SLOT", "FBT", "SLF", "ASYNC", "INP", "EXE", "FIX", "NPY", "PD", "PLE", "DOC",
]
ignore = [
  "Q",
  "whitespace-before-punctuation",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
  "runtime-import-in-type-checking-block",
  "invalid-function-name",
  "import-outside-top-level",
  "import-private-name",
  "any-type",
  "module-import-not-at-top-of-file",
  "commented-out-code",
  "non-empty-init-module",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "invalid-module-name",
  "function-call-in-default-argument",
  "unused-async",
]
extend-select = ["unused-noqa", "non-imperative-mood"]

[tool.ruff.lint.pylint]
max-public-methods = 21

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -n auto --dist loadgroup --max-worker-restart 0"
markers = [
  "native_lanes: executable pinned upstream extraction canaries requiring built standalone workers",
  "live: requires network access to a real registry or docs.rs; opt-in, reported separately",
  "xdist_group(name): serialize tests that share process-level state",
]
