# Reuse proof: a library from a different domain, added by manifest alone.
schema_version: library-guides.library_manifest.v1
library_id: pydantic-python
ecosystem: python
packages:
  - name: pydantic
    public_root: pydantic
surface_packages: ['pydantic', 'pydantic.*']
profiles:
  - profile_id: pydantic-python-locked
    version_source: python_locked_distribution
    version_key: pydantic
    scope: the interpreter and lock this repository resolves
    api_source:
      kind: griffe_static
      module: pydantic
registry_probes: []
