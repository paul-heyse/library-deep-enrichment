[package]
name = "lde-source-facts"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/library-deep-enrichment"
publish = false

[workspace]
exclude = ["upstream"]

[dependencies]
lde-protocol = { path = "../protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
tree-sitter = "=0.26.12"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-md = "=0.5.3"
ruff_python_ast = { path = "upstream/crates/ruff_python_ast" }
ruff_python_parser = { path = "upstream/crates/ruff_python_parser" }
ruff_python_semantic = { path = "upstream/crates/ruff_python_semantic" }
ruff_text_size = { path = "upstream/crates/ruff_text_size" }

ruff_linter = { path = "upstream/crates/ruff_linter", default-features = false }

[profile.dev]
debug = 0
