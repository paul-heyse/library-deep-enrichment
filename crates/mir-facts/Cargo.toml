[package]
name = "lde-mir-facts"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/library-deep-enrichment"
publish = false

[workspace]

[dependencies]
lde-protocol = { path = "../protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"

[profile.dev]
debug = 0
