[package]
name = "lde-python-semantics"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/library-deep-enrichment"
publish = false

[workspace]

[dependencies]
lde-protocol = { path = "../protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
pyrefly = { path = "upstream/pyrefly" }
pyrefly_config = { path = "upstream/crates/pyrefly_config" }
pyrefly_python = { path = "upstream/crates/pyrefly_python" }
pyrefly_util = { path = "upstream/crates/pyrefly_util" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
