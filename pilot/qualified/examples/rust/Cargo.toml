[package]
name = "lde-columnar-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "lde_interop"
crate-type = ["cdylib"]

[dependencies]
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
arrow-arith = "=58.4.0"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "=1.0.151"
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-arrow = "=0.17.0"

[profile.dev]
debug = 0
