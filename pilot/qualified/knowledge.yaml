    by overriding supports_filters_pushdown; its default leaves filters empty. Logical
    evaluation is filters, then limit, then projection; inexact filters prevent pushing
    down the limit.
  mechanism: Implement a source scan contract when the source needs an execution plan
    and declared pushdown behavior.
  evidence:
  - evidence:datafusion-catalog-54.1.0:692:docs
  conditions:
  - datafusion-catalog 54.1.0; recorded profile
  exceptions:
  - A limit can be pushed only under the documented filter conditions; this interface
    does not promise external snapshot consistency.
  verification: documented
  category: behavioral
- id: claim:rust-async
  profile: rust-docsrs-54.1-58.4
  statement: AsyncScalarUDFImpl supports asynchronous invocation and registration
    of remote functions; its documentation states it is less efficient than ScalarUDFImpl.
  mechanism: Use the async scalar extension mechanism when remote scalar invocation
    is itself required.
  evidence:
  - evidence:datafusion-expr-54.1.0:6475:docs
  conditions:
