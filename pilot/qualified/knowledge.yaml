decisions:
- id: decision:rust-placement
  stack: pilot
  profile: rust-docsrs-54.1-58.4
  task: Choose query-plan projection or a direct Arrow addition
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:rust-project
    when: Need to combine the transform with relational query operations.
    claims:
    - claim:rust-project
  - capability: cap:rust-add
    when: Need a direct Arrow operation on already materialized values.
    claims:
    - claim:rust-add
  - capability: cap:rust-udf
    when: Required scalar semantics remain unexpressed after a scoped catalog search.
    claims:
    - claim:rust-udf
  comparison: A query projection composes expressions into a DataFrame plan. The direct
    kernel accepts Arrow operands and specifically reports overflow. Select based
    on where the values currently live, and check the arithmetic policy separately.
    ScalarUDFImpl supplies extension hooks when the required semantics are still missing;
    do not infer blanket optimizer opacity from its being a UDF.
  claims:
  - claim:rust-project
  - claim:rust-add
  - claim:rust-udf
  reversing_conditions:
  - Need a direct Arrow operation on already materialized values.
  - Required scalar semantics remain unexpressed after a scoped catalog search.
  family: transformation
  examples:
  - rust-behavior
- id: decision:python-placement
  stack: pilot
  profile: python-installed-54.0-25.0.1
  task: Choose Python query projection or Arrow compute
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:python-project
    when: The values belong to a query pipeline.
    claims:
    - claim:python-project
  - capability: cap:python-add
    when: Already materialized arrays or a different overflow policy are required.
    claims:
    - claim:python-add
  comparison: Projection remains in a query plan until execution. Arrow compute.add
    acts on supplied array-like or scalar-like arguments and wraps integer overflow;
    choose add_checked for an error policy.
  claims:
  - claim:python-project
  - claim:python-add
  reversing_conditions:
  - Already materialized arrays or a different overflow policy are required.
  family: transformation
  examples:
  - python-behavior
- id: decision:rust-results
  stack: pilot
  profile: rust-docsrs-54.1-58.4
  task: Choose buffered or streaming Rust query results
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:rust-collect
    when: All output batches must be retained together.
    claims:
    - claim:rust-collect
  - capability: cap:rust-stream
    when: Incremental consumption or drop-driven cancellation is required.
    claims:
    - claim:rust-stream
  comparison: Collect buffers all result batches. execute_stream exposes a single-partition
    stream whose drop aborts execution. This does not prove that every upstream operator
    uses bounded memory.
  claims:
  - claim:rust-collect
  - claim:rust-stream
  reversing_conditions:
  - Incremental consumption or drop-driven cancellation is required.
  family: lifecycle
  examples:
  - rust-behavior
- id: decision:python-results
  stack: pilot
  profile: python-installed-54.0-25.0.1
  task: Choose Python result materialization
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:python-collect
    when: The consumer needs the complete list of batches.
    claims:
    - claim:python-collect
  - capability: cap:python-stream
    when: The consumer can process a record-batch stream.
    claims:
    - claim:python-stream
  comparison: Collect returns a list of batches in memory; execute_stream returns
    a stream. Rust cancellation documentation is not automatically a guarantee about
    the Python wrapper.
  claims:
  - claim:python-collect
  - claim:python-stream
  reversing_conditions:
  - The consumer can process a record-batch stream.
  family: lifecycle
  examples:
  - python-behavior
- id: decision:python-representation
  stack: pilot
  profile: python-installed-54.0-25.0.1
  task: Choose Table or RecordBatchReader representation
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:table-reader
    when: A downstream API consumes a RecordBatchReader.
    claims:
    - claim:table-reader
  - capability: cap:reader-all
    when: The caller requires a materialized Table.
    claims:
    - claim:reader-all
  comparison: to_reader exposes an existing Table through a zero-copy reader; read_all
    collects a reader into a Table. These operations point in different directions
    and are not a blanket zero-copy guarantee for an arbitrary downstream consumer.
  claims:
  - claim:table-reader
  - claim:reader-all
  reversing_conditions:
  - The caller requires a materialized Table.
  family: interchange
  examples:
  - python-behavior
- id: decision:pydantic-input
  stack: pilot
  profile: pydantic-2.13.4
  task: Choose object or JSON validation
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:validate-object
    when: The input is already a Python object.
    claims:
    - claim:validate-object
  - capability: cap:validate-json
    when: The input is JSON data.
    claims:
    - claim:validate-json
  comparison: Choose the entry point matching the input representation. Both expose
    strictness controls, but this comparison does not assert identical validation
    semantics for every Python and JSON type.
  claims:
  - claim:validate-object
  - claim:validate-json
  reversing_conditions:
  - The input is JSON data.
  family: validation
  examples:
  - pydantic-behavior
- id: decision:serde-input
  stack: pilot
  profile: serde-json-1.0.151
  task: Choose JSON text or IO deserialization
  requirements:
  - Match representation and execution placement to the stated consumer.
  candidates:
  - capability: cap:json-text
    when: JSON text is already available.
    claims:
    - claim:json-text
  - capability: cap:json-reader
    when: Input is an IO stream; consider EOF and buffering requirements.
    claims:
    - claim:json-reader
  comparison: from_str consumes JSON text; from_reader reads an IO stream and expects
    EOF. Add buffering for inefficient short reads and manage a Deserializer for a
    persistent connection.
  claims:
  - claim:json-text
  - claim:json-reader
  reversing_conditions:
  - Input is an IO stream; consider EOF and buffering requirements.
  family: validation
  examples:
  - rust-behavior
- id: decision:rust-enrichment
  stack: pilot
  profile: rust-docsrs-54.1-58.4
  task: Choose where to integrate external enrichment
  requirements:
  - Declare reference-key uniqueness or a duplicate rule.
  - Specify required source freshness and who owns acquisition.
  - Keep provider filter semantics and remote scalar policies explicit.
  candidates:
  - capability: cap:rust-join
    when: The source has already been acquired as a relation and a join expresses
      the matching rule.
    claims:
    - claim:rust-join
  - capability: cap:rust-provider
    when: The source needs a reusable scan plan with explicit projection, filters
      and limit contracts.
    claims:
    - claim:rust-provider
  - capability: cap:rust-async
    when: Remote scalar invocation itself is required under an explicit caller-owned
      consistency and retry policy.
    claims:
    - claim:rust-async
  comparison: 'Compare the source acquisition boundary before choosing the extension.
    A join combines relations, a provider builds a source scan plan, and an async
    scalar extension invokes remote functions. A left join does not establish key
    uniqueness: the fixture multiplies the duplicate right key. None of these interface
    descriptions establishes snapshot consistency for an arbitrary external service.'
  claims:
  - claim:rust-join
  - claim:rust-provider
  - claim:rust-async
  - claim:relational-observation
  reversing_conditions:
  - The source needs a reusable scan plan with explicit projection, filters and limit
    contracts.
  - Remote scalar invocation itself is required under an explicit caller-owned consistency
    and retry policy.
  family: enrichment
  examples:
  - rust-behavior
- id: decision:rust-rows
  stack: pilot
  profile: rust-docsrs-54.1-58.4
  task: Choose aggregate, window or a custom accumulator
  requirements:
  - Choose output cardinality.
  - Specify null, empty-input and frame policies for the selected functions.
  candidates:
  - capability: cap:rust-aggregate
    when: A grouped result is wanted and existing expressions represent the statistic.
    claims:
    - claim:rust-aggregate
  - capability: cap:rust-window
    when: Results should be attached to existing rows with an explicit frame and ordering.
    claims:
    - claim:rust-window
  - capability: cap:rust-udaf
    when: A required statistic remains unexpressed after searching the scoped aggregate
      catalog.
    claims:
    - claim:rust-udaf
  comparison: Use grouped aggregation for a grouped result or a window to attach results
    to the existing columns. The fixture demonstrates the differing row counts. The
    custom aggregate API requires an accumulator and state contract; its existence
    does not demonstrate that a custom aggregate is needed.
  claims:
  - claim:rust-aggregate
  - claim:rust-window
  - claim:rust-udaf
  - claim:relational-observation
  reversing_conditions:
  - Results should be attached to existing rows with an explicit frame and ordering.
  - A required statistic remains unexpressed after searching the scoped aggregate
    catalog.
  family: aggregation
  examples:
  - rust-behavior
- id: decision:python-dataset
  stack: pilot
  profile: python-installed-54.0-25.0.1
  task: Choose Scanner or direct Parquet table reading
  requirements:
  - Choose required output representation.
  - State filter and column selection.
  - Treat pruning and total memory separately from batch sizing.
  candidates:
  - capability: cap:python-scanner
    when: Consumption needs a scan object, batch/readahead controls or advanced projection
      expressions.
    claims:
    - claim:python-scanner
  - capability: cap:python-parquet
    when: The consumer wants a Table directly from a Parquet source.
    claims:
    - claim:python-parquet
  comparison: Both mechanisms support projection and filters. Scanner defers loading
    and exposes consumption controls; read_table directly materializes a Table. Metadata-based
    pruning is conditional. The fixture compares the same filtered projection through
    both paths without claiming physical IO savings.
  claims:
  - claim:python-scanner
  - claim:python-parquet
  reversing_conditions:
  - The consumer wants a Table directly from a Parquet source.
  family: dataset
  examples:
  - python-behavior
integrations:
- id: integration:c-stream
  profile: interop-pilot
  producer: cap:table-reader
  consumer: cap:rust-import
  representation: Arrow C Stream capsule; the Rust reader can be re-exported through
    into_pyarrow
  ownership: The declared fixture remains readable after its Python producers are
    deleted; this is witnessed behavior for this fixture.
  lifecycle: The declared fixture rejects a second import of the same consumed capsule.
  failures:
  - Second import of the consumed capsule is rejected in the declared fixture.
  claims:
  - claim:table-reader
  - claim:rust-import
  - claim:rust-export
  - claim:interop-observation
  examples:
  - interop-behavior
