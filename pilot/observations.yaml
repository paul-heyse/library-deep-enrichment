- task: rust-enrichment
  disposition: supported
  reviewer: Codex qualitative task review 2026-09-11
  finding: The alternatives are a relation join, a provider scan contract and an async
    remote scalar interface. The decision requires an external freshness policy rather
    than inventing snapshot guarantees. The duplicate-key fixture demonstrates why
    a left join alone does not establish row-count preservation.
  comparison: The previous generated briefs and navigator did not bind their recommendations
    to current item-level review fingerprints. This route retains the conditions and
    exact supporting artifacts.
  reversing_condition: The source needs a reusable scan plan with explicit projection,
    filters and limit contracts.; Remote scalar invocation itself is required under
    an explicit caller-owned consistency and retry policy.
  follow_up: Retain the stated evidence class and applicability limits; re-review
    if the recorded inputs or requirement changes.
  records:
  - - decision:rust-enrichment
    - 2eb903edf5bb024713bf4de8fd7796c0ec056a0a8d95b5abbce77ada22e97087
