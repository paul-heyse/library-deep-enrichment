mode: qualitative
tasks:
- id: rust-placement
  prompt: Choose expression composition, direct Arrow compute, or a scalar extension
  profile: rust-docsrs-54.1-58.4
  requirements:
  - Execution placement
  - Overflow policy
  - Conditional extension use
- id: python-placement
  prompt: Transform an already materialized Arrow column or a query column
  profile: python-installed-54.0-25.0.1
  requirements:
  - Representation
  - Query versus kernel
  - Checked versus wrapping overflow
- id: rust-results
  prompt: Consume a large Rust query result incrementally
  profile: rust-docsrs-54.1-58.4
  requirements:
  - Stream versus collect
  - Drop behavior
  - No blanket operator-memory guarantee
- id: python-results
  prompt: Choose a Python batch stream or collected results
  profile: python-installed-54.0-25.0.1
  requirements:
  - Result type
  - No borrowed Rust cancellation guarantee
- id: python-representation
  prompt: Adapt Table and RecordBatchReader consumers
  profile: python-installed-54.0-25.0.1
  requirements:
  - Conversion direction
  - Materialization
  - Scoped copy claims
- id: pydantic-input
  prompt: Validate Python objects or JSON input
  profile: pydantic-2.13.4
  requirements:
  - Representation
  - Strictness caveat
- id: serde-input
  prompt: Deserialize JSON text or a persistent IO connection
  profile: serde-json-1.0.151
  requirements:
  - from_str versus from_reader
  - EOF
  - Buffering
- id: c-stream
  prompt: Transfer a nullable Arrow reader through Rust and back
  profile: interop-pilot
  requirements:
  - Schema and metadata
  - Ownership lifetime
  - Capsule single use
  - Fixture-scoped buffer evidence
- id: rust-enrichment
  prompt: Choose relation join, source provider, or remote scalar integration
  profile: rust-docsrs-54.1-58.4
