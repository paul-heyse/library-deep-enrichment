decisions:
- id: decision:arrow-schema:construction-routes
  stack: arrow-rust
  profile: rust-docsrs-54.1-58.4
  task: Choose an Arrow Rust schema construction route from the available inputs.
  requirements:
  - Use the retained Arrow schema 58.4.0 documentation context.
  - Choose by available input representation, required metadata and whether reconciliation
    is intended.
  - Do not infer ordinary consumer availability or complete merge/conflict behavior
    from this declaration guide.
  candidates:
  - capability: capability:draft:b2ad7b8782353e844424de2e6fd8b029f6d3cc2ff01b1e81dc1e4fd34c3ccde4
    when: You have field values and do not need to supply schema metadata in this
      call.
    claims:
    - claim:draft:b2ad7b8782353e844424de2e6fd8b029f6d3cc2ff01b1e81dc1e4fd34c3ccde4:signature
    - claim:draft:b2ad7b8782353e844424de2e6fd8b029f6d3cc2ff01b1e81dc1e4fd34c3ccde4:documentation
  - capability: capability:draft:90d663776c42f41d5f62a1db7847e162b8388df05be3fc56ebe000ea51800f40
    when: You have field values plus a HashMap<String, String> of schema metadata.
    claims:
    - claim:draft:90d663776c42f41d5f62a1db7847e162b8388df05be3fc56ebe000ea51800f40:signature
    - claim:draft:90d663776c42f41d5f62a1db7847e162b8388df05be3fc56ebe000ea51800f40:documentation
  - capability: capability:draft:d5332af7390c435f7c6fab12975ff9fa74b415a38f5927bbe3e0422f5c60ff9f
    when: You already have a schema and want only specified column indices; the upstream
      documentation states that parent metadata carries over.
    claims:
    - claim:draft:d5332af7390c435f7c6fab12975ff9fa74b415a38f5927bbe3e0422f5c60ff9f:signature
    - claim:draft:d5332af7390c435f7c6fab12975ff9fa74b415a38f5927bbe3e0422f5c60ff9f:documentation
  - capability: capability:draft:6ca3b36c0d9f63f199e9c2a45fcf43ebdba9c9aa7a7c5c0712b4e30b85aca545
    when: You have multiple schemas to reconcile and require the documented compatible
      recursive struct-field merge; the precise conflict policy still needs separate
      evidence.
    claims:
    - claim:draft:6ca3b36c0d9f63f199e9c2a45fcf43ebdba9c9aa7a7c5c0712b4e30b85aca545:signature
    - claim:draft:6ca3b36c0d9f63f199e9c2a45fcf43ebdba9c9aa7a7c5c0712b4e30b85aca545:documentation
  - capability: capability:draft:c8c759a8342ac1b428e0c660ea5a48b6548d22fff44fb3c9eeeb92d3712eef7a
    when: You already have a SchemaBuilder and are ready to consume it for the final
      schema.
    claims:
    - claim:draft:c8c759a8342ac1b428e0c660ea5a48b6548d22fff44fb3c9eeeb92d3712eef7a:signature
    - claim:draft:c8c759a8342ac1b428e0c660ea5a48b6548d22fff44fb3c9eeeb92d3712eef7a:documentation
  comparison: Schema::new and Schema::new_with_metadata construct from fields; the
    latter takes explicit schema metadata. Schema::project selects columns from an
    existing schema, with metadata retention stated by its documentation. Schema::try_merge
    accepts an iterator of schemas and returns a Result, with compatible recursive
    struct-field merging documented separately. SchemaBuilder::finish consumes an
    existing builder. These five nominated routes cover the reviewed input choices;
    the retained 65-record neighborhood also includes accessors, trait implementations
    and other operations, which remain unreviewed alternatives outside this bounded
    task.
  claims:
  - claim:draft:b2ad7b8782353e844424de2e6fd8b029f6d3cc2ff01b1e81dc1e4fd34c3ccde4:signature
  - claim:draft:b2ad7b8782353e844424de2e6fd8b029f6d3cc2ff01b1e81dc1e4fd34c3ccde4:documentation
  - claim:draft:90d663776c42f41d5f62a1db7847e162b8388df05be3fc56ebe000ea51800f40:signature
  - claim:draft:90d663776c42f41d5f62a1db7847e162b8388df05be3fc56ebe000ea51800f40:documentation
  - claim:draft:d5332af7390c435f7c6fab12975ff9fa74b415a38f5927bbe3e0422f5c60ff9f:signature
  - claim:draft:d5332af7390c435f7c6fab12975ff9fa74b415a38f5927bbe3e0422f5c60ff9f:documentation
  - claim:draft:6ca3b36c0d9f63f199e9c2a45fcf43ebdba9c9aa7a7c5c0712b4e30b85aca545:signature
  - claim:draft:6ca3b36c0d9f63f199e9c2a45fcf43ebdba9c9aa7a7c5c0712b4e30b85aca545:documentation
  - claim:draft:c8c759a8342ac1b428e0c660ea5a48b6548d22fff44fb3c9eeeb92d3712eef7a:signature
  - claim:draft:c8c759a8342ac1b428e0c660ea5a48b6548d22fff44fb3c9eeeb92d3712eef7a:documentation
  reversing_conditions:
  - Explicit metadata input favors new_with_metadata over new.
  - Selecting existing columns favors project; combining schemas instead requires
    reconciliation evidence.
  - An existing builder can be finished without first reconstructing its fields.
  - Nullability, metadata-conflict precedence, copying, allocation, or feature-specific
    availability requirements remain open and may reverse the choice.
  family: schema-construction
