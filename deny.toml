# Dependency policy for the root workspace. The three excluded worker workspaces vendor ruff
# and pyrefly and are checked separately by `just native-check`.
[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # Not in this project's design: no graph database, embeddings, vector store or RPC server in
  # the fact producers. deny.toml is the mechanical oracle for that rule.
  { crate = "tonic" },
  { crate = "redis" },
  { crate = "neo4rs" },
  { crate = "qdrant-client" },
  { crate = "lancedb" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
